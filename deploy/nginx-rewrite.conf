# 宝塔 Nginx 伪静态规则（站点设置 → 伪静态 粘贴）
location / {
    try_files $uri $uri/ /index.php?$query_string;
}
# 敏感目录/文件禁止直出（备份/日志/市场包/源码/配置）
location ~ ^/(var|data|install|tools|tests|vendor|config\.inc\.php) {
    deny all;
}
# uploads 禁止执行脚本
location ~* ^/uploads/.*\.(php|php[0-9]|phtml|pl|py|cgi)$ {
    deny all;
}
