<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="中国故事 CNTales">
  <title>CNTales · 彩绘脸谱</title>
  <defs>
    <clipPath id="faceClipB">
      <path d="M5.6 7.2c0-1.7 1.3-3 3-3h14.8c1.7 0 3 1.3 3 3v7.5c0 6.7-4.4 11.7-10.4 14.5C10 26.4 5.6 21.4 5.6 14.7z"/>
    </clipPath>
  </defs>
  <!-- 脸型：朱砂底色 + 墨描边 -->
  <path d="M5.6 7.2c0-1.7 1.3-3 3-3h14.8c1.7 0 3 1.3 3 3v7.5c0 6.7-4.4 11.7-10.4 14.5C10 26.4 5.6 21.4 5.6 14.7z"
        fill="#c8402f" stroke="#0a0b0d" stroke-width="1.8" stroke-linejoin="round"/>
  <g clip-path="url(#faceClipB)">
    <!-- 额心白底 + 石青云头 -->
    <path d="M16 3.4c2.4 2.7 3.6 4.5 3.6 6.2 0 1.9-1.6 3.2-3.6 3.2s-3.6-1.3-3.6-3.2c0-1.7 1.2-3.5 3.6-6.2z" fill="#ffffff"/>
    <path d="M16 5.8c1.3 1.6 2 2.6 2 3.6 0 1.1-.9 1.9-2 1.9s-2-.8-2-1.9c0-1 .7-2 2-3.6z" fill="#2b5d8a"/>
    <!-- 云纹 · 松绿 -->
    <path d="M8.8 5.2c1.4 1 2.2 2.3 2.4 3.9M23.2 5.2c-1.4 1-2.2 2.3-2.4 3.9" stroke="#2f7d5f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- 眉 · 墨（粗） -->
    <path d="M7.6 13.2c2.2-1.8 4.4-2 6.4-.9M24.4 13.2c-2.2-1.8-4.4-2-6.4-.9"
          stroke="#0a0b0d" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- 眼：白底 + 墨瞳 -->
    <ellipse cx="11.5" cy="17" rx="3" ry="2.1" fill="#ffffff"/>
    <ellipse cx="20.5" cy="17" rx="3" ry="2.1" fill="#ffffff"/>
    <circle cx="11.5" cy="17" r="1.2" fill="#0a0b0d"/>
    <circle cx="20.5" cy="17" r="1.2" fill="#0a0b0d"/>
    <!-- 颊纹 · 藤黄 -->
    <path d="M6.4 20.6c1.6 1 2.5 2.4 2.9 4.2M25.6 20.6c-1.6 1-2.5 2.4-2.9 4.2"
          stroke="#c2952c" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- 鼻 · 石青；口 · 黛紫 -->
    <path d="M16 19.4v3.6" stroke="#2b5d8a" stroke-width="2" stroke-linecap="round"/>
    <path d="M12 25.2c1.8 1.2 6.2 1.2 8 0" stroke="#5a4a80" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <!-- 髭口两侧 · 赭石 -->
    <path d="M9.6 23.4c.9.2 1.6.7 2 1.4M22.4 23.4c-.9.2-1.6.7-2 1.4"
          stroke="#a8642a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
